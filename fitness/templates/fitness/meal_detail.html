{% extends 'fitness/base.html' %}

{% block content %}
<h1>{{ meal.name }}</h1>
<p>Calories: {{ meal.calories }}</p>
<p>Carbs: {{meal.carbs }}g</p>
<p>Protein: {{meal.protein }}g</p>
<p>Fat: {{ meal.fat }}g</p>
<p>Logged on {{ meal.day.date }}</p>

<a href="{% url 'meal_update' meal.pk %}">Edit</a>
<a href="{% url 'meal_delete' meal.pk %}">Delete</a>
{% endblock %}
